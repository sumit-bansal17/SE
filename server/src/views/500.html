<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 Server Error | TIET-Sync API Server</title>
  <link rel="icon" type="image/webp" href="/images/tiet-sync-location-pin-logo.webp">
  <link rel="stylesheet" href="/css/tiet-sync.css">
</head>
<body>

  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-container">
      <a href="/" class="topbar-brand">
        <img src="/images/tiet-sync-location-pin-logo.webp" alt="TIET-Sync Logo" class="topbar-logo">
        <div class="topbar-title-group">
          <span class="topbar-title">TIET-Sync</span>
          <span class="topbar-subtitle">CAMPUS OS</span>
        </div>
      </a>
      <div class="topbar-actions">
        <a href="/docs" class="btn-outline-docs">API Docs</a>
        <a href="{{CLIENT_URL}}" class="btn-topbar-app" target="_blank" rel="noopener noreferrer">
          Open Web App
        </a>
      </div>
    </div>
  </header>

  <!-- Error Content -->
  <main class="main-wrapper">
    <div class="error-hero">
      <div class="error-code">500</div>
      <h1 class="error-title">Academic Server Error</h1>
      <p class="error-message">
        {{ERROR_MESSAGE}}
      </p>
      <div style="display:flex; gap:12px; justify-content:center; margin-top:8px;">
        <a href="/" class="btn-back-home">&larr; Back to Home</a>
        <a href="/api/health" class="btn-outline-docs" target="_blank">Check Server Health</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="page-footer">
    Thapar Institute of Engineering & Technology &bull; TIET-Sync Engine
  </footer>

</body>
</html>
